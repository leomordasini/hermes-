<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Portal — Datadog</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🐕</text></svg>">
  <link rel="stylesheet" href="app/css/style.css">
</head>
<body>
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;">
      <div style="font-size:2.5rem;">🐕</div>
      <div style="color:#8888aa;font-size:0.95rem;">Loading Manager Portal...</div>
    </div>
  </div>

  <script type="module">
    // Import all modules (they self-register via registerModule)
    import './app/modules/dashboard.js';
    import './app/modules/team.js';
    import './app/modules/oneOnOnes.js';
    import './app/modules/goals.js';
    import './app/modules/projects.js';
    import './app/modules/actions.js';
    import './app/modules/notes.js';
    import './app/modules/reviews.js';
    import './app/modules/settings.js';

    // Boot the app
    import { boot } from './app/app.js';
    boot().catch(err => {
      console.error('Boot failed:', err);
      document.getElementById('app').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;">
          <div style="font-size:2.5rem;">⚠️</div>
          <div style="color:#ef5350;font-size:1.1rem;font-weight:600;">Failed to load</div>
          <div style="color:#8888aa;font-size:0.85rem;">${err.message}</div>
        </div>`;
    });
  </script>
</body>
</html>
